<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DC Truck Tracking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to bottom right, #0d6efd, #00bcd4);
      color: white;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      max-width: 400px;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }
    .small-text {
      font-size: 0.9rem;
      opacity: 0.9;
    }
    .btn-custom {
      margin-top: 1rem;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border-radius: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚚 ระบบติดตามรถขนส่ง DC </h1>
    <p>กรุณากดปุ่มด้านล่างเพื่อเข้าสู่ระบบติดตาม</p>
    
    <!-- ข้อความให้กำลังใจ -->
    <p class="small-text mt-2">🚦 ขอให้ขับขี่ปลอดภัย เดินทางโดยสวัสดิภาพครับ</p>
    
    <!-- ปุ่มไปยังระบบ -->
    <a href="https://script.google.com/macros/s/AKfycbxiyu0i89rur5tCqXDIApdU3-CDDLOYFk2koQbAmGDwHNxC4hjum3sFi3LtQ835OkiB-A/exec" class="btn btn-light btn-custom">เข้าสู่ระบบ</a>
    
    <!-- ข้อความสำรอง -->
    <p class="small-text mt-3">หากไม่สามารถเข้าหน้าได้ ให้ลองรีเฟรชหรือใช้เบราว์เซอร์อื่น</p>
  </div>
</body>
</html>
